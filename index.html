    <script>
      // Gracefully handle and suppress Vite HMR WebSocket connection errors in AI Studio iframe preview
      if (typeof window !== 'undefined') {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/')))) {
              const listeners = {};
              return {
                binaryType: 'blob',
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                url: String(url),
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent() { return false; },
                send() {},
                close() {},
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          const msg = event?.reason?.message || '';
          if (msg.includes('WebSocket') || msg.includes('vite-hmr')) {
            event.preventDefault();
          }
        });

        window.addEventListener('error', function(event) {
          const msg = event?.message || '';
          if (msg.includes('WebSocket') || msg.includes('vite-hmr')) {
            event.preventDefault();
          }
        });
      }
    </script>
